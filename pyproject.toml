[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelingbench"
version = "0.1.0"
description = "Auditable iterative AI modeling harness for Blender"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ModelingBench contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["playwright"]
reference = ["numpy>=1.26,<3", "Pillow>=10,<13", "scipy>=1.11,<2"]
reconstruction = ["numpy>=1.26,<3", "Pillow>=10,<13", "scipy>=1.11,<2"]

[project.scripts]
modelbench = "modelbench.cli:main"
modelbench-agent = "modelbench.agent_cli:main"
modelbench-reconstruct = "modelbench.reconstruction.cli:main"

[tool.setuptools.packages.find]
include = ["modelbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
modelbench = ["ui/*.html", "ui/*.css", "ui/*.js"]
