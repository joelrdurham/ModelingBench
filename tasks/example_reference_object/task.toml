version = 1
id = "example_reference_object"
title = "Example Reference Object"

[research]
enabled = true

[frame]
unit_scale = 1.0
up_axis = "+Z"
front_axis = "-Y"
evaluation_center = [0.0, 0.0, 0.0]
bounds_min = [-1.5, -1.5, 0.0]
bounds_max = [1.5, 1.5, 2.5]
ground_plane = true

[[anchors]]
name = "object_center"
position = [0.0, 0.0, 1.25]
tolerance = 0.05

[verification]
frames = [1]

[verification.materials]
enabled = true
base_color_linear_rgb = [0.18, 0.18, 0.18]
base_color_tolerance = 0.001
default_roughness = 0.36
roughness_tolerance = 0.01
roughness_ranges = { default = [0.2, 0.8], rubber = [0.2, 0.8], glass = [0.1, 0.8] }
