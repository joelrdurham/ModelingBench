version = 1
id = "example_drawing_object"
title = "Example Drawing Object"

[research]
enabled = false

[frame]
unit_scale = 1.0
up_axis = "+Z"
front_axis = "-Y"
evaluation_center = [0.0, 0.0, 0.0]
bounds_min = [-1.0, -1.0, 0.0]
bounds_max = [1.0, 1.0, 2.0]
ground_plane = true

[[anchors]]
name = "base_center"
position = [0.0, 0.0, 0.0]
tolerance = 0.02

[verification]
frames = [1]

[verification.materials]
enabled = true
base_color_linear_rgb = [0.18, 0.18, 0.18]
base_color_tolerance = 0.001
default_roughness = 0.36
roughness_tolerance = 0.01
roughness_ranges = { default = [0.2, 0.8], rubber = [0.2, 0.8], glass = [0.1, 0.8] }
