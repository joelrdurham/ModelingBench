version = 1
id = "example_greybox_level"
title = "Example Greybox Level"

[research]
enabled = false

[frame]
unit_scale = 1.0
up_axis = "+Z"
front_axis = "-Y"
evaluation_center = [0.0, 0.0, 0.0]
bounds_min = [-8.0, -8.0, 0.0]
bounds_max = [8.0, 8.0, 4.0]
ground_plane = true

[[anchors]]
name = "spawn"
position = [0.0, -6.0, 0.0]
tolerance = 0.1

[[anchors]]
name = "goal"
position = [0.0, 6.0, 0.0]
tolerance = 0.1

[[dimensions]]
name = "spawn_to_goal"
from_anchor = "spawn"
to_anchor = "goal"
value = 12.0
tolerance = 0.1
unit = "m"

[verification]
frames = [1]

[verification.materials]
enabled = true
base_color_linear_rgb = [0.18, 0.18, 0.18]
base_color_tolerance = 0.001
default_roughness = 0.36
roughness_tolerance = 0.01
roughness_ranges = { default = [0.2, 0.8], rubber = [0.2, 0.8], glass = [0.1, 0.8] }
